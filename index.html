<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche 911</title>
    <link rel="stylesheet" href="porsche.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

    <header class="topbar">
        <a href="#" class="logo" aria-label="Porsche home">
            <img src="porschelogo.png" alt="Porsche">
        </a>

        <nav class="links" aria-label="Main">
            <a href="#">Models</a>
            <a href="#">Configurator</a>
            <a href="#">Dealers</a>
            <a href="#">Experience</a>
        </nav>

        <div class="menu">
            <button aria-label="Account"><i class="fa-solid fa-user"></i></button>
            <span class="divider"></span>
            <button class="lang" aria-label="Language">EN</button>
            <span class="divider"></span>
            <button aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
            <span class="divider"></span>
            <button aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <aside class="social" aria-label="Social media">
        <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
    </aside>

    <main class="hero">

        <div class="text">
            <h1>Porsche 911</h1>
            <p class="lead">Engineered to inspire.<br>Built to perform.</p>

            <div class="cta">
                <a href="#" class="btn btn-primary">Configure your 911</a>
                <a href="#" class="btn btn-ghost">Discover more</a>
            </div>
        </div>

        <div class="car">
            <img src="porsche911.png" alt="Porsche 911" class="porsche">
        </div>

        <p class="tagline">Every curve. Every corner. Every second.</p>

        <dl class="specs">
            <div class="spec">
                <dd>296<small> km/h</small></dd>
                <dt>Top speed</dt>
            </div>
            <div class="spec">
                <dd>525<small> PS</small></dd>
                <dt>Power</dt>
            </div>
        </dl>

    </main>

</body>
</html>
